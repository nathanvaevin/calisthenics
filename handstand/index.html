<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handstand weeks</title>
<meta name="description" content="The Inversion Method, week by week.">

<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../assets/components.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="screen">
<div id="screen"></div>

<script src="../assets/screen-nav.js"></script>
<script src="../assets/screen-chooser.js"></script>
<script>
/* One line per week. To open the next one, give it a file and a title.

   START is the Monday of week 1. The week the class is in is worked out
   from it, so there is no number to move by hand any more. Change this one
   date if the course started on a different day. */
const START = "2026-09-14";
const WEEKS = [
  {n:1, file:"week-1.html", t:"The line and the wall",
   s:"Build the shape on the floor, learn the bail, get comfortable upside down."},
  {n:2, file:"week-2.html", t:"Wrists and the line",
   s:"Two paths: settling a sore wrist, and the kinetic chain."},
  {n:3}, {n:4}
];

renderChooser(WEEKS, {
  current: courseWeek(START, WEEKS.length),
  barTitle: "All training",
  kicker: "Handstand weekly training",
  title: "The Inversion Method",
  lede: "Four weeks upside down. Open the week the class is in.",
  backHref: "../index.html"
});
</script>
</body>
</html>
