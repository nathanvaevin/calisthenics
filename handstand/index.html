<link rel="stylesheet" href="../tokens.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body class="screen">
<div id="screen"></div>

<script src="../assets/screen-nav.js"></script>
<script src="../assets/screen-chooser.js"></script>
<script>
/* One line per week. To open the next one, give it a file and a title.
   CURRENT is the week the class is actually in. Move this number each week. */
const CURRENT = 2;
const WEEKS = [
  {n:1, file:"week-1.html", t:"The line and the wall",
   s:"Build the shape on the floor, learn the bail, get comfortable upside down."},
  {n:2, file:"week-2.html", t:"Wrists and the line",
   s:"Two paths: settling a sore wrist, and the kinetic chain."},
  {n:3}, {n:4}
];

renderChooser(WEEKS, {
  current: CURRENT,
  barTitle: "All training",
  kicker: "Handstand weekly training",
  title: "The Inversion Method",
  lede: "Four weeks upside down. Open the week the class is in.",
  backHref: "../index.html"
});
</script>
</body>
</html>
