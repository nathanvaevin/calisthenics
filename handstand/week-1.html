        ["Stick overhead hold and rotation","10 second holds","Grip wide, biceps by the ears, elbows locked, slow torso rotations. Feel the difference between shrugging up and actively pushing.","Kinetic Chain &amp; Prep|Stick overhead hold and rotation"],

        ["Down dog, open the bottle","3 sets of 30 seconds","Elbows locked, turn the hands open as if opening a bottle and push hard against the floor. Straight-arm support and external rotation together.","Kinetic Chain &amp; Prep|Down dog"],

  {tag:"LINE", name:"The kinetic chain", why:"Wrist to shoulder to ribs to hips. Learn the shape on the floor, where you cannot fall, before you ask for it upside down.",

     6:[["Pike scapular push-ups","3 sets of 8","Hips high, arms locked. Only the shoulder blades move: sink between them, then push tall and spread them wide.","Kinetic Chain &amp; Prep|Pike scapular push-up"],

        ["Hollow rocks","3 sets of 20","If the shape breaks before the target, stop and rest. A broken hollow trains nothing.","Core &amp; Compression|Hollow rocks"]]
   }},
  {tag:"PUSH", name:"Pushing strength", why:"A handstand is an overhead press you hold instead of finish. This is where the holding strength comes from.",

        ["Wall shoulder taps","8 each side","In the chest-to-wall handstand, tap one hand to the opposite shoulder. Weight shift and stability.","Handstand|Wall shoulder taps"]],
     5:[["Chest-to-wall hold","3 sets of 45 seconds","Fingers active, rhythmic breathing throughout. Compare it against your week-one hold.","Handstand|Chest-to-wall handstand"],

     6:[["Overbalance and underbalance drill","10 attempts","Deliberately shift into overbalance and back. Overbalance, you cartwheel out; underbalance, you step down. Knowing both is what frees the balance.","Handstand|Overbalance and underbalance drill"],
