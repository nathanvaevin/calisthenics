<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose your week</title>
<meta name="description" content="Eight weeks of calisthenics homework. Open the week the class is in.">

<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../assets/components.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="screen">
<div id="screen"></div>

<script src="../assets/screen-nav.js"></script>
<script src="../assets/screen-chooser.js"></script>
<script>
/* One line per week. To open the next one, give it a file and a title.
   CURRENT is the week the class is actually in. Move this number each week. */
const CURRENT = 2;
const WEEKS = [
  {n:1, file:"week-1.html", t:"Finding your level",
   s:"The first set of exercises, from your scorecard."},
  {n:2, file:"week-2.html", t:"The pull-up",
   s:"Dead hangs through to pull-up singles, plus push, hold and legs."},
  {n:3, file:"week-3.html", t:"Handstands",
   s:"The line from wrist to hip, and the wall. Pull keeps running underneath."},
  {n:4, file:"week-4.html", t:"Push-ups",
   s:"Pressing week. Scapular work up to diamonds and bar dips."},
  {n:5, file:"week-5.html", t:"Legs",
   s:"Squats and hinges, bodyweight only. Nothing needed but a chair."},
  {n:6, file:"week-6.html", t:"Core",
   s:"The shapes that hold every other position together."},
  {n:7, file:"week-7.html", t:"Skill day",
   s:"Light week before the retest. Movement and fun, not a grind."},
  {n:8, rest:true, t:"Retest day",
   s:"No homework. We re-run the scorecard in class and see how far you moved."}
];

renderChooser(WEEKS, {
  current: CURRENT,
  barTitle: "All training",
  kicker: "Calisthenics weekly training",
  title: "Choose your week",
  lede: "Eight weeks. Weeks 1 and 8 are test days we run in class, the rest have homework.",
  backHref: "../index.html"
});
</script>
</body>
</html>
