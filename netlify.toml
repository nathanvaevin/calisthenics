# Every push to main is a production deploy, so don't spend one on a commit
# that changes nothing people can see. This skips the build when the only
# changes are dev tooling or documentation.
#
# Netlify runs `ignore` and SKIPS the build when it exits 0. `git diff --quiet`
# exits 0 when there is no difference — so "no change outside tools/ and *.md"
# means no deploy. Anything that actually ships still builds normally.
#
# Publish directory is deliberately left to the Netlify UI setting.

[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)tools/**' ':(exclude)*.md'"
