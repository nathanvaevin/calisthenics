<!doctype html>
<meta charset="utf-8">
<title>3D contact sheet</title>
<style>
  body{background:#0F172A;margin:0;padding:12px;font-family:sans-serif}
  .grid{display:flex;flex-wrap:wrap;gap:10px}
  .cell{width:240px;background:#172033;border:1px solid #2E3A50;border-radius:10px;padding:6px}
  .cell.hold{border-color:#6FBF73}
  .cap{color:#93A1B5;font-size:10px;text-align:center;margin-top:2px;line-height:1.25}
  .cap b{color:#E8EDF5;font-weight:600}
  .cap .h{color:#6FBF73}
  .cap .r{color:#E9A23B}
  .fig3d{display:block}
  .fig3d svg{width:100%;height:auto;display:block}
  .fig3d .fig-cap{display:none}
  .p3l{stroke:#2E3C55}
  .b3l{stroke:#E9A23B;stroke-linecap:round}
  .b3h{fill:none;stroke:#E9A23B;stroke-width:4}
  .b3d{fill:#E9A23B}
  #err{color:#E4693B;font-family:monospace;font-size:11px;white-space:pre-wrap}
</style>
<div class="grid" id="grid"></div>
<div id="err"></div>
<script>
  // Freeze the animation loop so frames can be driven deterministically.
  window.requestAnimationFrame = function(){ return 0; };
</script>
<script src="../assets/engine.js"></script>
<script>
const params = new URLSearchParams(location.search);
const keys = JSON.parse(params.get("keys") || "[]");
const rawT = Number(params.get("t") || 0);        // 0 = start of rep, 1 = end of rep
const grid = document.getElementById("grid");
const errs = [];

keys.forEach(key => {
  const cfg = RIG3D[key];
  const cell = document.createElement("div");
  cell.className = "cell" + (cfg && cfg.p.hold != null ? " hold" : "");
  grid.append(cell);
  if(!cfg){ errs.push("no rig: " + key); cell.innerHTML = '<div class="cap">no 3D rig</div>'; return; }
  const before = players.length;
  try { make3D(cell, key, ""); } catch(e){ errs.push(key + ": " + e.message); return; }
  const p = players[before];
  const svg = cell.querySelector("svg");
  // stop the auto-rotate so every cell is drawn from the same angle
  svg.dispatchEvent(new MouseEvent("mousedown", {clientX:0, clientY:0, bubbles:true}));
  window.dispatchEvent(new MouseEvent("mouseup", {bubbles:true}));
  if(p && p.tick) p.tick(rawT * 2600);
  const kind = cfg.p.hold != null
    ? '<span class="h">HOLD (frozen at t=' + cfg.p.hold + ')</span>'
    : '<span class="r">rep · t=' + rawT + '</span>';
  const cap = document.createElement("div");
  cap.className = "cap";
  cap.innerHTML = "<b>" + key.replace("&amp;","&").split("|")[1] + "</b><br>" + kind;
  cell.append(cap);
});
document.getElementById("err").textContent = errs.join("\n");
document.title = "ready";
</script>
